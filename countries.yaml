# American Exit Index — country roster
#
# Top 20 destination countries for US emigrants, chosen from State Dept
# Form DS-2003 (Statement of Residency) totals + r/AmerExit poll data +
# IRS expat tax filings by country. Roster reviewed quarterly.
#
# Each country defines:
#   slug          — kebab-case, used for filenames and URLs
#   name          — display name
#   region        — for grouping in the dashboard
#   primary_visa  — the most-used residency pathway for US citizens
#   secondary_visas — alternate pathways
#   overrides     — manual values that beat scraped data
#                   (use when scraping is unreliable; review monthly)

countries:
  - slug: portugal
    name: Portugal
    region: Western Europe
    primary_visa: D7 (Passive Income)
    secondary_visas: [Digital Nomad D8, Golden Visa, D2 Entrepreneur]
    numbeo_country_code: PT
    overrides:
      months_to_permanent_residency: 60      # 5 years to PR
      visa_processing_days: 60
      visa_financial_requirement_usd: 9120   # ~12x SMN, EUR→USD

  - slug: spain
    name: Spain
    region: Western Europe
    primary_visa: Non-Lucrative Visa (NLV)
    secondary_visas: [Digital Nomad Visa, Golden Visa, Student, Work]
    numbeo_country_code: ES
    overrides:
      months_to_permanent_residency: 60
      visa_processing_days: 90
      visa_financial_requirement_usd: 32400  # ~400% IPREM

  - slug: mexico
    name: Mexico
    region: Latin America
    primary_visa: Temporary Resident
    secondary_visas: [Permanent Resident, Retirement]
    numbeo_country_code: MX
